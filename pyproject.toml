[project]
name = "personal-superagent"
version = "0.2.0"
description = "个人多 Agent 工作台：逐课实现"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.30",
  "langgraph==1.2.18",
  "langchain-openai==1.7.3",
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "psutil>=7,<8",
]

[project.scripts]
superagent = "personal_superagent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10"]
browser = ["playwright>=1.58,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
