<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Superagent</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#282828;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100dvh;display:grid;place-items:center}.card{width:min(380px,calc(100vw - 40px));padding:35px;background:#fff;border:1px solid #e8e8e8;border-radius:16px;box-shadow:0 10px 45px #00000003}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:-.5px}.logo{background:#292929;color:#fff;display:grid;place-items:center;width:31px;height:31px;border-radius:9px;font-size:20px}h1{font-size:22px;font-weight:550;margin:30px 0 6px}p{font-size:12px;color:#999;margin:0 0 25px}label{font-size:12px;color:#666;display:block;margin-top:17px}input{font:inherit;width:100%;border:1px solid #ddd;padding:10px 12px;border-radius:8px;margin-top:7px;outline:0}input:focus{border-color:#999}button{width:100%;border:0;background:#2a2a2a;color:white;border-radius:8px;padding:11px;margin-top:28px;font:inherit;cursor:pointer}button:hover{background:#444}.error{font-size:12px;color:#9b6262;margin-top:15px}footer{margin-top:24px;text-align:center;color:#aaa;font-size:10px}
</style></head><body><main class="card"><div class="brand"><span class="logo">✧</span>superagent</div><h1>欢迎回来</h1><p>登录你的个人工作台</p>
<form method="post">{% csrf_token %}<label for="id_username">用户名</label>{{ form.username }}<label for="id_password">密码</label>{{ form.password }}
{% if form.errors %}<div class="error">用户名或密码不正确，请重试。</div>{% endif %}<input type="hidden" name="next" value="{{ next }}"><button>登录</button></form><footer>任务与设备由你的账号独立管理</footer></main></body></html>
