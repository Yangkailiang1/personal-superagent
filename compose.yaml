name: personal-superagent
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: ${PGDATABASE:-personal_superagent}
      POSTGRES_USER: ${PGUSER:-personal_superagent}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env or your shell}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
